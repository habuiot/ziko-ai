name: Házikó maintenance inventory
on:
  pull_request:
    paths: ['haziko_maintenance/**', '.github/workflows/haziko-maintenance.yml']
  push:
    paths: ['haziko_maintenance/**', '.github/workflows/haziko-maintenance.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q haziko_maintenance
      - run: python -m unittest discover -s haziko_maintenance -p 'test_*.py' -v
      - run: python -m pip install PyYAML==6.0.3
      - run: python -c 'import yaml; from pathlib import Path; x=yaml.safe_load(Path("haziko_maintenance/config.yaml").read_text()); assert x["map"] == [{"type": "local_apps", "read_only": True}, {"type": "share", "read_only": True}]; assert x["ingress"] is True and "ports" not in x and x["boot"] == "manual"'
      - run: docker build -t haziko-maintenance-test haziko_maintenance
