name: Ziko HA Tools
on:
  push:
    paths: ['custom_components/ziko_ha_tools/**', 'tools_tests/**', 'tools/pack_ha_tools.py', 'ZIKO_HA_TOOLS.md', 'hacs.json', '.github/workflows/ziko-ha-tools.yml']
  pull_request:
    paths: ['custom_components/ziko_ha_tools/**', 'tools_tests/**', 'tools/pack_ha_tools.py', 'ZIKO_HA_TOOLS.md', 'hacs.json', '.github/workflows/ziko-ha-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.10.0' 'pytest==9.1.1' 'pytest-asyncio==1.4.0'
      - run: python -m pytest -c tools_tests/pytest.ini tools_tests -q
      - run: python -m compileall -q custom_components/ziko_ha_tools
      - run: python tools/pack_ha_tools.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: Ziko-HA-Tools
          path: dist/*
